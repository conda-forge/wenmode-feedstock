# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15.2"
  python_check_max: "3.14"

package:
  name: wenmode
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/w/wenmode/wenmode-${{ version }}.tar.gz
    sha256: 8623f00f0a05f5031c1d6d47f3680f354a7331ee9a768f4e483b162a4802dc1a
    target_directory: dist
  - url: https://github.com/lepture/wenmode/archive/refs/tags/${{ version }}.tar.gz
    sha256: 6e18e152a567d0efcbc66f1f7025b6eed6d355c5d01773c47990b7c8e6f3bfc1
    target_directory: src

build:
  number: 0
  noarch: python
  script:
    - cd dist
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies
  python:
    entry_points:
      - wenmode = wenmode.cli:main

requirements:
  host:
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/wenmode/**
      site_packages:
        - wenmode/**
        - wenmode-${{ version }}.dist-info/**
  - python:
      imports: wenmode
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - src/docs/
        - src/pyproject.toml
        - src/README.md
        - src/tests/
    requirements:
      run:
        - mypy
        - pip
        - pytest-cov
        - python ${{ python_min }}.*
    script:
      file: run_test.py

about:
  summary: A fast, composable Markdown parser and renderer toolkit.
  license: BSD-3-Clause
  license_file: dist/LICENSE
  homepage: https://pypi.org/project/wenmode
  documentation: https://wenmode.lepture.com
  repository: https://github.com/lepture/wenmode

extra:
  recipe-maintainers:
    - bollwyvl
