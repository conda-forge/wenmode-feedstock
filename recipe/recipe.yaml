# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.0"
  python_check_max: "3.14"

package:
  name: wenmode
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/w/wenmode/wenmode-${{ version }}.tar.gz
    sha256: fa5d1383099b32bcbc0b475646d3409d9355cbf156dae4eeef22478cb9ddb107
    target_directory: dist
  - url: https://github.com/lepture/wenmode/archive/refs/tags/${{ version }}.tar.gz
    sha256: 8fac227a8cc25ea4487a491030dc2d1a4d01c0a2f681a2763b38bd4274ce0f31
    target_directory: src

build:
  number: 0
  noarch: python
  script:
    - cd dist
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
  python:
    entry_points:
      - wenmode = wenmode.cli:main

requirements:
  host:
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports: wenmode
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - src/docs/
        - src/pyproject.toml
        - src/README.md
        - src/tests/
    requirements:
      run:
        - mypy
        - pip
        - pytest-cov
        - python ${{ python_min }}.*
    script:
      file: run_test.py

about:
  summary: A fast, composable Markdown parser and renderer toolkit.
  license: BSD-3-Clause
  license_file: dist/LICENSE
  homepage: https://pypi.org/project/wenmode
  documentation: https://wenmode.lepture.com
  repository: https://github.com/lepture/wenmode

extra:
  recipe-maintainers:
    - bollwyvl
