# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.1"
  python_check_max: "3.14"

package:
  name: wenmode
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/w/wenmode/wenmode-${{ version }}.tar.gz
    sha256: 11fb438a0a3c6964ed31e12d39065df0b80735a0ff24f77c701ee0d485c406fd
    target_directory: dist
  - url: https://github.com/lepture/wenmode/archive/refs/tags/${{ version }}.tar.gz
    sha256: 7262d29d9f1d1ed6df6009e39409f7c4097c9bc094303d77cd371061564d33a2
    target_directory: src

build:
  number: 0
  noarch: python
  script:
    - cd dist
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
  python:
    entry_points:
      - wenmode = wenmode.cli:main

requirements:
  host:
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports: wenmode
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - src/docs/
        - src/pyproject.toml
        - src/README.md
        - src/tests/
    requirements:
      run:
        - mypy
        - pip
        - pytest-cov
        - python ${{ python_min }}.*
    script:
      file: run_test.py

about:
  summary: A fast, composable Markdown parser and renderer toolkit.
  license: BSD-3-Clause
  license_file: dist/LICENSE
  homepage: https://pypi.org/project/wenmode
  documentation: https://wenmode.lepture.com
  repository: https://github.com/lepture/wenmode

extra:
  recipe-maintainers:
    - bollwyvl
